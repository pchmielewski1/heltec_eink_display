[platformio]
default_envs = wireless_paper_v11

; Heltec Wireless Paper v1.1 is ESP32-S3 based. If you have a dedicated PlatformIO board
; definition (e.g. `heltec_wireless_paper`), you can switch `board` below.

[env:wireless_paper_v11]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
; Use a stable symlink so the port still works if it enumerates as ttyUSB0/ttyUSB1/etc.
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0

; Avoid compiling the full Heltec library (includes LoRa/TFT code with extra deps)
lib_ignore =
  Heltec ESP32 Dev-Boards

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0
  ; Heltec display code is vendored as a minimal local library in:
  ; lib/heltec_wireless_paper_eink

build_flags =
  -D CORE_DEBUG_LEVEL=3
  ; Use UART serial (CP2102 USB-UART)
  -D ARDUINO_USB_CDC_ON_BOOT=0
